name: ai-founder

# Copy this file to .github/workflows/agent.yml in your fork.
on:
  schedule:
    - cron: "0 */6 * * *"    # build cycle: every 6 hours (UTC)
    - cron: "15 6 * * *"     # daily article: once a day at 06:15 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Which to run now"
        type: choice
        default: cycle
        options: [cycle, article]

permissions:
  contents: write
  issues: read

concurrency:
  group: ai-founder
  cancel-in-progress: false

jobs:
  cycle:
    if: ${{ github.event.schedule == '0 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'cycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Remember where this run started
        run: echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Collect real-world signals (read-only, before the agent wakes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 agent/metrics.py || true
      - name: Run one build cycle
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BIN: /home/runner/.local/bin/claude
        run: |
          chmod +x agent/*.sh
          ./agent/run-cycle.sh
      - name: Guard (secrets, emails, private terms), blocks the push if anything leaks
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          git config user.name "ai-founder"
          git config user.email "founder@users.noreply.github.com"
          git add -A
          git commit -m "chore: run bookkeeping $(date -u +%FT%TZ)" || true
          git show "$BASE:agent/guard.py" > "$RUNNER_TEMP/guard.py"   # guard as it was BEFORE the agent ran
          python3 "$RUNNER_TEMP/guard.py" "$BASE"
      - name: Push the agent's work
        run: git push

  article:
    if: ${{ github.event.schedule == '15 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'article') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Remember where this run started
        run: echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Collect real-world signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 agent/metrics.py || true
      - name: Write today's daily article
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BIN: /home/runner/.local/bin/claude
        run: |
          chmod +x agent/*.sh
          ./agent/daily-article.sh
      - name: Guard
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          git config user.name "ai-founder"
          git config user.email "founder@users.noreply.github.com"
          git add -A
          git commit -m "chore: run bookkeeping $(date -u +%FT%TZ)" || true
          git show "$BASE:agent/guard.py" > "$RUNNER_TEMP/guard.py"
          python3 "$RUNNER_TEMP/guard.py" "$BASE"
      - name: Push the article
        run: git push
